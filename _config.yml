
title: "Chi's Lab Notes"
author: "Chi Zhou"
email: "zhouchi24@mails.ucas.ac.cn"

description: "Bioinformatics · Single-cell Genomics · Computational Biology"

url: "https://qingyuye.github.io"
baseurl: ""

lang: "zh-CN"
timezone: "Asia/Shanghai"

remote_theme: riggraz/no-style-please

# Markdown 渲染
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: true

permalink: /:slug.html

favicon: "logo.png"

theme_config:
  appearance: "light"
  back_home_text: "Home"
  date_format: "%Y-%m-%d"
  show_description: true
  lowercase_titles: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

plugins:
  - jekyll-feed
  - jekyll-seo-tag
